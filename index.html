<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!--    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">-->
<!--    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">-->

    <title>Music Player</title>

    <link rel="stylesheet" href="./static/css/style.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <meta name="apple-mobile-web-app-title" content="Music Player">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" id="statusBarMeta" content="black">

    <meta content="telephone=no" name="format-detection"/>
    <meta content="email=no" name="format-detection"/>

    <link rel="apple-touch-icon" sizes="180x180" href="./static/img/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./static/img/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./static/img/icon/favicon-16x16.png">
    <link rel="manifest" href="./static/img/icon/site.webmanifest">
</head>

<body>
<!-- Modern Player Layout -->
<div class="app-top-drag"></div>

<div class="app-layout">
    <!-- Sidebar for Playlist -->
    <aside class="sidebar-layout">
        <h1 id="player-title" title="Music Player" class="sidebar-title"><span class="sidebar-title-text">Music Player</span></h1>
        <div class="file-selector">
            <label for="folder-input" class="btn-style btn-file">
                <i class="fa-solid fa-folder-open"></i> <span data-i18n="selectFolder">文件夹</span>
                <input type="file" id="folder-input" class="hidden" webkitdirectory directory accept=".mp3,.wav,.ogg,.m4a,.flac,.aac,.aiff,.aif,.amr,.wma,.mid,.midi,.opus,.weba,audio/mpeg,audio/wav,audio/ogg,audio/x-m4a,audio/flac,audio/aac,audio/aiff,audio/x-aiff,audio/amr,audio/x-ms-wma,audio/midi,audio/opus,audio/webm">
            </label>
            <label for="single-song-input" class="btn-style btn-file">
                <i class="fa-solid fa-music"></i> <span data-i18n="selectFile">文件</span>
                <input type="file" id="single-song-input" class="hidden" accept=".mp3,.wav,.ogg,.m4a,.flac,.aac,.aiff,.aif,.amr,.wma,.mid,.midi,.opus,.weba,audio/mpeg,audio/wav,audio/ogg,audio/x-m4a,audio/flac,audio/aac,audio/aiff,audio/x-aiff,audio/amr,audio/x-ms-wma,audio/midi,audio/opus,audio/webm" multiple>
            </label>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="搜索歌曲...">
        </div>
        <div id="drag-drop-area" class="drag-drop-zone">
            <p><i class="fa-solid fa-cloud-arrow-up text-muted"></i></p>
            <p><span data-i18n="dragDropHint">拖放到此处</span></p>
        </div>
        <div class="batch-ops-container" id="batch-ops-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; margin-top: 8px; padding: 0 10px;">
            <div style="display: flex; gap: 16px;">
                <button id="select-all-btn" class="btn-transparent hidden" title="全选"><i class="fa-solid fa-check-double"></i></button>
                <button id="delete-selected-btn" class="btn-transparent hidden" title="删除选中" style="color: #ef4444;"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div>
                <button id="multi-select-btn" class="btn-transparent" title="批量选择"><i class="fa-solid fa-list-check"></i></button>
            </div>
        </div>
        <div class="song-list-scroll">
            <div class="song-list" id="song-list"></div>
        </div>
    </aside>

    <!-- Main Content Area (Cover/Lyrics) -->
    <main class="main-layout" id="main-layout">
        <div class="top-bar">
            <button id="toggle-playlist-btn" class="toggle-playlist-btn" title="Toggle Playlist">
                <i class="fa-solid fa-list-ul"></i>
            </button>
            <div style="flex:1"></div>
            <button id="lang-toggle" class="lang-toggle" title="Switch Language">
                <i class="fa-solid fa-language"></i>
                <span id="lang-label">EN</span>
            </button>
        </div>
        <div class="center-content">
            <div class="cover-area">
                <img id="album-cover" class="album-cover-img" src="" alt="" style="display: none;" />
            </div>
            <!-- Future lyrics can go here or side-by-side -->
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer class="bottom-bar">
        <!-- Visualizer mapped to background of bottom bar -->
        <canvas id="visualizer" class="visualizer-modern"></canvas>

        <!-- Left tool group: Pitch -->
        <div class="extra-controls left-tools">
            <div class="tool-group" data-i18n-title="pitchShift" title="音高调节">
                <i class="fa-solid fa-music"></i>
                <input type="range" id="pitch-shift" class="slider-style" min="-5" max="5" step="1" value="0">
                <span id="pitch-shift-val" class="val-display">0</span>
            </div>
        </div>

        <div class="playback-controls">
            <div class="player-controls">
                <button id="random-btn" class="btn-icon" data-i18n-title="shuffle" title="随机播放">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button id="prev-btn" class="btn-icon" data-i18n-title="prev" title="上一曲">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="play-pause-btn" class="btn-icon play-btn" data-i18n-title="play" title="播放">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="next-btn" class="btn-icon" data-i18n-title="next" title="下一曲">
                    <i class="fa-solid fa-forward"></i>
                </button>
                <button id="loop-btn" class="btn-icon" data-i18n-title="loop" title="循环播放">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>
            <div class="progress-container">
                <div class="progress" id="progress">
                    <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Right tool group: Tempo -->
        <div class="extra-controls right-tools">
            <div class="tool-group" data-i18n-title="tempoShift" title="速度调节">
                <i class="fa-solid fa-gauge-high"></i>
                <input type="range" id="tempo-shift" class="slider-style" min="0.5" max="1.5" step="0.1" value="1">
                <span id="tempo-shift-val" class="val-display">1.0x</span>
            </div>
        </div>
    </footer>
</div>
<script src="./static/js/i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script src="./static/js/main.js"></script>
</body>

</html>
